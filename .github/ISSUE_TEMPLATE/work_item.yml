name: Engineering task
description: Track a concrete verification, documentation or operations deliverable, not a sprint.
labels: [task, "priority:p2", "status:backlog"]
body:
  - type: markdown
    attributes:
      value: Search for an existing task first. Issues track concrete deliverables, not sprint containers. Logging alone does not approve implementation. Routine work goes directly to main and risky work through a PR, as described in docs/GITHUB_WORKFLOW.md; "Closes #N" in the delivering commit or PR closes the issue. No invented deadline, release, milestone closure or real-media job is authorized by this form. Keep evidence public-safe.
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Planning/contributor workflow (area:workflow)
        - Tests/CI (area:ci)
        - Editor and frontend (area:editor)
        - Source/import/relinking (area:media)
        - Native export/storage (area:export)
        - Preview/hardware (area:preview)
        - Music/A/V (area:audio)
        - Docker/Podman (area:container)
        - License/distribution obligations (area:licensing)
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal, scope and non-goals
      description: Define the concrete outcome or pending decision and its boundaries. Sprint membership belongs in the Project, not a tracker issue/checklist.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and verification
      description: Observable completion criteria and applicable checks. Separate local commits/tests, actual-commit remote CI and owner hardware/real-workload acceptance.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, milestone and Project context
      description: Existing prerequisites, deliverable parent and outcome milestone; native Project Iteration or selected-work context only when explicitly selected. Preserve hierarchy; never use parent/sub-issues for sprint membership.
  - type: textarea
    id: next
    attributes:
      label: Next action, priority and blockers
      description: State the immediate step, why it matters and any access, owner decision or consent required. Do not put secrets or private paths here.
    validations:
      required: true
