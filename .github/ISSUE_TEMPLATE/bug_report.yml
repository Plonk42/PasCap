name: Bug report
description: Report a reproducible editor, preview, import or export problem.
labels: [bug, 'priority:p2', 'status:backlog']
body:
  - type: markdown
    attributes:
      value: Do not attach private footage, credentials, local project files or licensed audio. Use synthetic media when possible and redact filesystem paths. Triage applies area labels, assesses priority and links an outcome milestone; default normal priority is not a severity verdict. Sprint selection belongs in the Project, not a tracker issue or parent relationship.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Select the primary area; triage can add other relevant area labels.
      options:
        - Editor and frontend (area:editor)
        - Source/import/relinking (area:media)
        - Native export/storage (area:export)
        - Preview/hardware (area:preview)
        - Music/A/V (area:audio)
        - Tests/CI (area:ci)
        - Docker/Podman (area:container)
        - License/distribution obligations (area:licensing)
        - Planning/contributor workflow (area:workflow)
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: Describe the risk so triage can replace the default priority appropriately.
      options:
        - Active data-loss or security risk
        - Core workflow or correctness gate blocked
        - Incorrect behaviour with a workaround
        - Minor or optional improvement
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe the expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest reproducible sequence and relevant frame/key values.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, Linux version, Node/FFmpeg versions, browser version and actual renderer if preview-related. Container packaging is not released yet.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized errors, a synthetic test case, screenshot or verification receipt. Note whether edits remain unsaved.
  - type: textarea
    id: next
    attributes:
      label: Next action and related tracking
      description: Smallest investigation/verification step, linked prerequisites and outcome milestone; native Project Iteration or selected-work context when approved. Distinguish local results from remote CI and hardware evidence; unknowns are acceptable.
