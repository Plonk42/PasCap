name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pull requests check Node 22 only; pushes to main also cover Node 24.
        node: ${{ github.event_name == 'pull_request' && fromJSON('[22]') || fromJSON('[22, 24]') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: github.event_name != 'pull_request'
        run: npm audit --audit-level=high

  native:
    name: Native media / FFmpeg 8.0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PASCAP_DATA_DIR: .pascap/ci
      PASCAP_MEDIA_ROOTS: "[]"
      PASCAP_FFMPEG: ${{ github.workspace }}/.ci/ffmpeg/bin/ffmpeg
      PASCAP_FFPROBE: ${{ github.workspace }}/.ci/ffmpeg/bin/ffprobe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/setup-ffmpeg
      - run: npm ci
      - name: Native synthetic media tests
        run: npm run test:media

  chrome:
    name: Chrome browser ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PASCAP_DATA_DIR: .pascap/ci
      PASCAP_MEDIA_ROOTS: "[]"
      PASCAP_FFMPEG: ${{ github.workspace }}/.ci/ffmpeg/bin/ffmpeg
      PASCAP_FFPROBE: ${{ github.workspace }}/.ci/ffmpeg/bin/ffprobe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/setup-ffmpeg
      - run: npm ci
      - name: Install Chrome
        run: npx playwright install --with-deps chrome
      - run: npm run build
      - name: Prepare isolated browser fixtures
        run: npx tsx scripts/fixtures.ts --browser
      - name: Browser regression tests
        run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=dot,html
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chrome-${{ matrix.shard }}-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    name: Firefox music and playback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PASCAP_DATA_DIR: .pascap/ci
      PASCAP_MEDIA_ROOTS: "[]"
      PASCAP_FFMPEG: ${{ github.workspace }}/.ci/ffmpeg/bin/ffmpeg
      PASCAP_FFPROBE: ${{ github.workspace }}/.ci/ffmpeg/bin/ffprobe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/setup-ffmpeg
      - run: npm ci
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Install Firefox software graphics and audio dependencies
        run: sudo -n apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libegl-mesa0 libglx-mesa0 pulseaudio pulseaudio-utils
      - run: npm run build
      - name: Prepare isolated browser fixtures
        run: npx tsx scripts/fixtures.ts --browser
      - name: Firefox music and playback regressions
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          __GLX_VENDOR_LIBRARY_NAME: mesa
          __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/50_mesa.json
        run: bash scripts/ci/firefox.sh npx playwright test --config=playwright.firefox.config.ts tests/browser/music-clock.spec.ts tests/browser/playback-recovery.spec.ts --grep 'streaming music clock|streamed PCM|with music normal speed|held sources|withheld decoded callback|with music and a callback-gated cancellation|native-event-ordered video catch-up|Playing publication rechecks' --output=test-results/firefox-music --reporter=dot
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firefox-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The only required check. Skipped/cancelled/failed jobs must not pass, so it runs
  # unconditionally and requires literal success from every suite.
  delivery:
    name: Delivery gate
    needs: [checks, native, chrome, firefox]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    env:
      RESULTS: checks=${{ needs.checks.result }} native=${{ needs.native.result }} chrome=${{ needs.chrome.result }} firefox=${{ needs.firefox.result }}
    steps:
      - name: Require successful suites
        shell: bash
        run: |
          for result in $RESULTS; do
            if [[ "${result#*=}" != success ]]; then
              printf 'Delivery blocked: %s\n' "$RESULTS"
              exit 1
            fi
          done
