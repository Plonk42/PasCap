name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high

  integration:
    name: Native media and browser / FFmpeg 8.0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: true
      PASCAP_DATA_DIR: .pascap/ci
      PASCAP_MEDIA_ROOTS: '[]'
      PASCAP_FFMPEG: ${{ github.workspace }}/.ci/ffmpeg/bin/ffmpeg
      PASCAP_FFPROBE: ${{ github.workspace }}/.ci/ffmpeg/bin/ffprobe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install native build dependencies
        run: sudo -n apt-get update && sudo -n apt-get install -y --no-install-recommends build-essential pkg-config nasm libx264-dev
      - name: Cache tested FFmpeg build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-ubuntu24-${{ hashFiles('scripts/ci/setup-ffmpeg.sh') }}
      - name: Build or verify FFmpeg 8.0.1
        run: bash scripts/ci/setup-ffmpeg.sh "$GITHUB_WORKSPACE/.ci/ffmpeg"
      - name: Report native toolchain
        run: '"$PASCAP_FFMPEG" -version && "$PASCAP_FFPROBE" -version'
      - run: npm ci
      - name: Install test browser
        run: npx playwright install --with-deps chrome
      - run: npm run build
      - name: Native synthetic media tests
        run: npm run test:media
      - name: Prepare isolated browser fixtures
        run: npx tsx scripts/fixtures.ts --browser
      - name: Browser regression tests
        run: npx playwright test --reporter=dot,html
      - name: Retain failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7